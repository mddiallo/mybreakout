<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakout Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Welcome Screen -->
    <div id="welcomeScreen" class="welcome-screen">
        <div class="welcome-container">
            <h1 class="welcome-title">BREAKOUT</h1>
            <p class="welcome-subtitle">Enter your name to start playing</p>
            <form id="nameForm" class="name-form">
                <input 
                    type="text" 
                    id="playerName" 
                    class="name-input" 
                    placeholder="Enter your name"
                    maxlength="20"
                    required
                    autofocus
                />
                <button type="submit" class="start-button">START GAME</button>
            </form>
        </div>
    </div>

    <!-- Game Container -->
    <div class="game-container hidden">
        <div class="score-container">
            <div class="score-item">
                <span class="label">Player:</span>
                <span id="playerNameDisplay" class="value"></span>
            </div>
            <div class="score-item">
                <span class="label">Score:</span>
                <span id="score" class="value">0</span>
            </div>
            <div class="score-item">
                <span class="label">Lives:</span>
                <span id="lives" class="value">3</span>
            </div>
        </div>
        
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div id="gameMessage" class="game-message hidden">
            <h2 id="messageText"></h2>
            <p id="messageSubtext">Press SPACE to start</p>
        </div>
        
        <div class="controls-info">
            <p>◀ ▶ Arrow Keys to Move | SPACE to Start/Restart</p>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="audio.js"></script>
    <script src="game.js"></script>
</body>
</html>
